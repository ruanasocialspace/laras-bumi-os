openapi: 3.1.0
info:
  title: Laras Bumi OS Foundation API
  version: 0.1.0
  description: Cookie-authenticated identity and foundation resources. First obtain an XSRF-TOKEN cookie from GET /sanctum/csrf-cookie on the app origin. For write requests send its decoded value in X-XSRF-TOKEN and send the session cookie with all authenticated requests.
servers:
  - url: http://localhost:8080/api/v1
security:
  - session: []
paths:
  /health/live:
    get:
      operationId: checkLiveness
      summary: Check Laravel liveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
  /health/ready:
    get:
      operationId: checkReadiness
      summary: Check PostgreSQL schema and Redis connections
      security: []
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Start a browser session
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: currentAccount
      summary: Read the current account and capabilities
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
  /reference:
    get:
      operationId: getReferenceValues
      summary: Read currency, unit and time zone
      responses:
        '200':
          description: Operational reference values
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [currency, mass_unit, timezone]
                    properties:
                      currency: { type: string, const: IDR }
                      mass_unit: { type: string, const: kg }
                      timezone: { type: string, const: Asia/Jakarta }
        '401': { $ref: '#/components/responses/Error' }
  /roles:
    get:
      operationId: getRoleCatalog
      summary: Read role definitions and their permission codes
      description: Requires identity.manage.
      responses:
        '200':
          description: Seeded role catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Role'
                        - type: object
                          required: [permissions]
                          properties:
                            permissions:
                              type: array
                              items: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listAccounts
      summary: List accounts and optionally search by name or email
      description: Requires identity.manage.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAccount
      summary: Create an account and assign approved roles
      description: Requires identity.manage.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AccountInput'
                - type: object
                  required: [name, email, password, role_codes]
      responses:
        '201': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAccount
      summary: Read a specific account
      description: Requires identity.manage.
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAccount
      summary: Change account details, active status or roles
      description: Requires identity.manage. An active administrator must remain. Password or active-status changes revoke existing sessions.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      operationId: getAuditLog
      summary: List recent audit records
      description: Requires audit.read. A successful access creates an audit entry.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: laras_session }
  parameters:
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Healthy:
      description: Service healthy
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
    Account:
      description: Account and effective permissions
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Account' }
    Error:
      description: Request could not be completed
      headers:
        X-Request-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, request_id]
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string, format: uuid }
                  fields:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
  schemas:
    Role:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Account:
      type: object
      required: [id, name, email, active, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        active: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { type: string }
    AccountInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 72
          description: The UTF-8 encoded password must fit in 72 bytes.
        active: { type: boolean }
        role_codes:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 8
          uniqueItems: true
    Pagination:
      type: object
      required: [links, meta]
      properties:
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first: { type: string }
            last: { type: string }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    AuditEntry:
      type: object
      required: [id, actor_id, action, resource_type, resource_id, request_id, details, occurred_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string, format: uuid }
        details: { type: object }
        occurred_at: { type: string, format: date-time }
