openapi: 3.1.0
info:
  title: Laras Bumi OS API
  version: 0.3.0
  description: Cookie-authenticated identity and foundation resources. First obtain an XSRF-TOKEN cookie from GET /sanctum/csrf-cookie on the app origin. For write requests send its decoded value in X-XSRF-TOKEN and send the session cookie with all authenticated requests.
servers:
  - url: http://localhost:8080/api/v1
security:
  - session: []
paths:
  /health/live:
    get:
      operationId: checkLiveness
      summary: Check Laravel liveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
  /health/ready:
    get:
      operationId: checkReadiness
      summary: Check PostgreSQL schema and Redis connections
      security: []
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Start a browser session
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: currentAccount
      summary: Read the current account and capabilities
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
  /reference:
    get:
      operationId: getReferenceValues
      summary: Read currency, unit and time zone
      responses:
        '200':
          description: Operational reference values
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [currency, mass_unit, timezone]
                    properties:
                      currency: { type: string, const: IDR }
                      mass_unit: { type: string, const: kg }
                      timezone: { type: string, const: Asia/Jakarta }
        '401': { $ref: '#/components/responses/Error' }
  /roles:
    get:
      operationId: getRoleCatalog
      summary: Read role definitions and their permission codes
      description: Requires identity.manage.
      responses:
        '200':
          description: Seeded role catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Role'
                        - type: object
                          required: [permissions]
                          properties:
                            permissions:
                              type: array
                              items: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listAccounts
      summary: List accounts and optionally search by name or email
      description: Requires identity.manage.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAccount
      summary: Create an account and assign approved roles
      description: Requires identity.manage.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AccountInput'
                - type: object
                  required: [name, email, password, role_codes]
      responses:
        '201': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAccount
      summary: Read a specific account
      description: Requires identity.manage.
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAccount
      summary: Change account details, active status or roles
      description: Requires identity.manage. An active administrator must remain. Password or active-status changes revoke existing sessions.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      operationId: getAuditLog
      summary: List recent audit records
      description: Requires audit.read. A successful access creates an audit entry.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customer-categories:
    get:
      operationId: listCustomerCategories
      summary: List customer categories
      description: Requires customers.read.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomerCategory
      summary: Create a customer category
      description: Requires customers.categories.manage.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers:
    get:
      operationId: listCustomers
      summary: List customers by name, code, category or status
      description: Requires customers.read.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, archived] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomer
      summary: Register a customer
      description: Requires customers.write.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}:
    get:
      operationId: getCustomer
      summary: Read a customer
      description: Requires customers.read.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCustomer
      summary: Change customer name, category or lifecycle
      description: Requires customers.write.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}/contacts:
    get:
      operationId: listCustomerContacts
      summary: List contacts for a customer
      description: Requires customers.read.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomerContact
      summary: Create a customer contact
      description: Requires customers.write.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Contact'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}/contacts/{record}:
    patch:
      operationId: updateCustomerContact
      summary: Change a customer contact
      description: Requires customers.write.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactFields' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Contact'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}/locations:
    get:
      operationId: listPickupLocations
      summary: List pickup locations for a customer
      description: Requires customers.read.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPickupLocation
      summary: Register a pickup location
      description: Requires customers.write.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}/locations/{record}:
    patch:
      operationId: updatePickupLocation
      summary: Change a pickup location
      description: Requires customers.write.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationFields' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customer}/billing-profile:
    get:
      operationId: getBillingProfile
      summary: Read the billing profile or null
      description: Requires finance.read.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    anyOf:
                      - $ref: '#/components/schemas/BillingProfile'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveBillingProfile
      summary: Create or replace the billing profile
      description: Requires finance.bill.
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BillingProfile'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /contracts:
    get:
      operationId: listContracts
      summary: List contracts by name, code, customer or effective status
      description: Requires contracts.read.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, suspended, expired, terminated] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceContract' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createContract
      summary: Create a draft contract
      description: Requires contracts.write.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractCreate' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceContract'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /contracts/{contract}:
    get:
      operationId: getContract
      summary: Read a contract and its effective status
      description: Requires contracts.read.
      parameters:
        - { name: contract, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceContract'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateContract
      summary: Change draft contract details
      description: Requires contracts.write.
      parameters:
        - { name: contract, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractFields' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceContract'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /contracts/{contract}/history:
    get:
      operationId: listContractHistory
      summary: List append-only contract status history
      description: Requires contracts.read.
      parameters:
        - { name: contract, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContractEvent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /contracts/{contract}/transitions:
    post:
      operationId: transitionContract
      summary: Record a contract lifecycle transition
      description: Requires contracts.activate.
      parameters:
        - { name: contract, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceContract'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
