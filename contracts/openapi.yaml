      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Healthy:
      description: Service healthy
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
    Account:
      description: Account and effective permissions
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Account' }
    Error:
      description: Request could not be completed
      headers:
        X-Request-ID:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, request_id]
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string, format: uuid }
                  current_revision: { type: integer, minimum: 0 }
                  fields:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
  schemas:
    PickupTask:
      type: object
      required: [id, customer_id, customer_name, location_id, service_date, slot, status, revision, address]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        location_id: { type: string, format: uuid }
        service_id: { type: [string, 'null'], format: uuid }
        schedule_id: { type: [string, 'null'], format: uuid }
        service_date: { type: string, format: date }
        slot: { type: string }
        status: { type: string, enum: [scheduled, assigned, en_route, arrived, completed, failed, canceled] }
        revision: { type: integer, minimum: 0 }
        location_name: { type: string }
        address: { type: string }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
        driver_id: { type: [string, 'null'], format: uuid }
        driver_name: { type: [string, 'null'] }
        vehicle_id: { type: [string, 'null'], format: uuid }
        vehicle_registration: { type: [string, 'null'] }
        contract_status: { type: [string, 'null'], enum: [draft, active, suspended, expired, terminated, null] }
    PickupCreate:
      type: object
      required: [client_task_id, customer_id, location_id, service_date, slot]
      properties:
        client_task_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        service_date: { type: string, format: date }
        slot: { type: string, pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$' }
    PickupGenerateInput:
      type: object
      required: [service_date]
      properties:
        service_date: { type: string, format: date }
    PickupGeneration:
      type: object
      required: [created, service_date]
      properties:
        created: { type: integer, minimum: 0 }
        service_date: { type: string, format: date }
    PickupAssignment:
      type: object
      required: [driver_id, vehicle_id, expected_revision]
      properties:
        driver_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        expected_revision: { type: integer, minimum: 0 }
    PickupCancellation:
      type: object
      required: [expected_revision, reason]
      properties:
        expected_revision: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 500 }
    PickupEvent:
      type: object
      required: [id, sequence, type, captured_at, received_at, evidence_ids]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 0 }
        type: { type: string, enum: [scheduled, assigned, en_route, arrived, completed, failed, canceled] }
        reason: { type: [string, 'null'] }
        captured_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
        accuracy_m: { type: [string, 'null'] }
        weight_kg: { type: [string, 'null'] }
        weight_basis: { type: [string, 'null'] }
        evidence_ids: { type: array, items: { type: string, format: uuid } }
    PickupEventInput:
      type: object
      required: [client_event_id, expected_revision, type, captured_at]
      description: Completion also requires coordinates, accuracy, evidence IDs and labeled positive weight. Failure requires a reason.
      properties:
        client_event_id: { type: string, format: uuid }
        expected_revision: { type: integer, minimum: 1 }
        type: { type: string, enum: [en_route, arrived, completed, failed] }
        captured_at: { type: string, format: date-time, pattern: '\.[0-9]{3}Z$' }
        reason: { type: string, maxLength: 500 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0, maximum: 10000 }
        weight_kg: { type: string, pattern: '^[0-9]{1,9}(\.[0-9]{1,3})?$' }
        weight_basis: { type: string, enum: [estimated, field_measured] }
        evidence_ids: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, format: uuid } }
    PickupAcknowledgement:
      type: object
      required: [event_id, sequence, status, revision]
      properties:
        event_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 0 }
        status: { type: string, enum: [scheduled, assigned, en_route, arrived, completed, failed, canceled] }
        revision: { type: integer, minimum: 0 }
    PickupEvidence:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: accepted }
    PickupUpload:
      type: object
      required: [client_file_id, photo]
      properties:
        client_file_id: { type: string, format: uuid }
        photo: { type: string, format: binary }
    CollectionDriver:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    CollectionVehicle:
      type: object
      required: [id, registration, name, active]
      properties:
        id: { type: string, format: uuid }
        registration: { type: string }
        name: { type: string }
        active: { type: boolean }
    CollectionVehicleInput:
      type: object
      required: [registration, name]
      properties:
        registration: { type: string, maxLength: 24 }
        name: { type: string, maxLength: 120 }
        active: { type: boolean }
    CollectionVehicleFields:
      type: object
      properties:
        registration: { type: string, maxLength: 24 }
        name: { type: string, maxLength: 120 }
        active: { type: boolean }
    Category:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        name: { type: string, maxLength: 160 }
    CategoryInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        name: { type: string, maxLength: 120 }
    Customer:
      type: object
      required: [id, code, name, category_id, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        name: { type: string, maxLength: 160 }
        category_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive, archived] }
    CustomerCreate:
      type: object
      required: [code, name, category_id]
      properties:
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        name: { type: string, maxLength: 160 }
        category_id: { type: string, format: uuid }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        category_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive, archived] }
    Contact:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
    ContactFields:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
    ContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
    Location:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 500 }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
    LocationInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 500 }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
    LocationFields:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 500 }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
    BillingProfile:
      type: object
      required: [id, billing_name, address, payment_term_days]
      properties:
        id: { type: string, format: uuid }
        billing_name: { type: string, maxLength: 160 }
        address: { type: string, maxLength: 500 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        payment_term_days: { type: integer, minimum: 0, maximum: 365 }
    BillingInput:
      type: object
      required: [billing_name, address, payment_term_days]
      properties:
        billing_name: { type: string, maxLength: 160 }
        address: { type: string, maxLength: 500 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        payment_term_days: { type: integer, minimum: 0, maximum: 365 }
    ServiceContract:
      type: object
      required: [id, code, customer_id, name, starts_on, status, effective_status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        customer_id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }
        status: { type: string, enum: [draft, active, suspended, expired, terminated] }
        effective_status: { type: string, enum: [draft, active, suspended, expired, terminated] }
    ContractFields:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }
    ContractCreate:
      type: object
      required: [code, customer_id, name, starts_on]
      properties:
        code: { type: string, pattern: '^[A-Z0-9a-z][A-Z0-9a-z_-]{0,31}$' }
        customer_id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }
    ContractEvent:
      type: object
      required: [id, actor_id, to_status, occurred_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        from_status: { type: [string, 'null'] }
        to_status: { type: string, enum: [draft, active, suspended, expired, terminated] }
        reason: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
    TransitionInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended, expired, terminated] }
        reason: { type: [string, 'null'], maxLength: 500 }
    ContractService:
      type: object
      required: [id, name, location_id]
      properties:
        id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        location_name: { type: string }
        name: { type: string, maxLength: 160 }
    ServiceInput:
      type: object
      required: [name, location_id]
      properties:
        location_id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
    ServiceRate:
      type: object
      required: [id, service_id, pricing_model, unit_rate, effective_from]
      properties:
        id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        pricing_model: { type: string, enum: [monthly, per_pickup, per_kg, one_time] }
        unit_rate: { type: string, pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$' }
    RateInput:
      type: object
      required: [pricing_model, unit_rate, effective_from]
      properties:
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        pricing_model: { type: string, enum: [monthly, per_pickup, per_kg, one_time] }
        unit_rate: { type: string, pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$' }
        replace_open: { type: boolean }
    PickupSchedule:
      type: object
      required: [id, series_id, service_id, weekday, slot, effective_from]
      properties:
        id: { type: string, format: uuid }
        series_id: { type: string, format: uuid }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        service_id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        slot: { type: string }
    ScheduleInput:
      type: object
      required: [service_id, weekday, slot, effective_from]
      properties:
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        service_id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        slot: { type: string, pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$' }
    Role:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Account:
      type: object
      required: [id, name, email, active, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        active: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { type: string }
    AccountInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 72
          description: The UTF-8 encoded password must fit in 72 bytes.
        active: { type: boolean }
        role_codes:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 8
          uniqueItems: true
    Pagination:
      type: object
      required: [links, meta]
      properties:
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first: { type: string }
            last: { type: string }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    AuditEntry:
      type: object
      required: [id, actor_id, action, resource_type, resource_id, request_id, details, occurred_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string, format: uuid }
        details: { type: object }
        occurred_at: { type: string, format: date-time }
